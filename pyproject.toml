[project]
name = "spde-s-t"
version = "0.1.0"
description = "S-transform + spectral neural network solver for SPDEs via deep backward dynamic programming"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
]

# torch: pull the CPU-only wheel (no GPU on this machine), pinned + reproducible
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
testpaths = ["tests"]
